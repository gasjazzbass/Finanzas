<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>ORBIT · Finanzas</title>
<meta name="description" content="Finanzas personales y familiares">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORBIT">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='7' r='2.5' fill='%23fff'/%3E%3C/svg%3E">
<script>
/* tema aplicado antes de pintar, para que no haya flash de color */
(function(){
  var p='dark';
  try{p=localStorage.getItem('orbit_theme')||'system'}catch(e){p='system'}
  var r=(p==='system')?(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):p;
  document.documentElement.dataset.theme=r;
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;--panel:#080808;--panel2:#101010;--line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.055);
  --txt:#f5f5f5;--dim:#7d7d7d;--dim2:#4d4d4d;
  --pos:#5fe3a1;--neg:#ff5f56;--warn:#ffcc4d;
  --solid:#fff;--onsolid:#000;--hover:#0b0b0b;--track:#1c1c1c;
  --shadow:none;
}
:root[data-theme="light"]{
  --bg:#fff;--panel:#fbfbfb;--panel2:#f3f3f3;--line:rgba(0,0,0,.13);--line2:rgba(0,0,0,.07);
  --txt:#0b0b0b;--dim:#6a6a6a;--dim2:#a0a0a0;
  --pos:#0a8f52;--neg:#d92d20;--warn:#a06800;
  --solid:#000;--onsolid:#fff;--hover:#f6f6f6;--track:#e6e6e6;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);min-height:100vh;
  font-family:"Helvetica Neue",Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:.01em;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  transition:background .2s,color .2s;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pos{color:var(--pos)}.neg{color:var(--neg)}.dim{color:var(--dim)}.warn{color:var(--warn)}
.up{text-transform:uppercase;letter-spacing:.18em}
.hide{display:none!important}
::selection{background:var(--solid);color:var(--onsolid)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--track)}
::-webkit-scrollbar-track{background:transparent}
svg{display:block}

/* ===================== AUTH / PIN ===================== */
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:26px calc(22px + env(safe-area-inset-left)) calc(26px + env(safe-area-inset-bottom))}
.authbox{width:100%;max-width:390px}
.wordmark{font-size:32px;font-weight:200;letter-spacing:.42em;text-indent:.42em;text-align:center}
.wordsub{text-align:center;font-size:9px;color:var(--dim);margin-top:10px}
.authform{margin-top:46px;display:flex;flex-direction:column;gap:22px}
.fld label{display:block;font-size:9px;color:var(--dim);margin-bottom:8px}
.fld input,.fld select,.fld textarea{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:11px 0;outline:none;font-size:16px;font-weight:300;transition:border-color .2s;border-radius:0
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-bottom-color:var(--solid)}
.fld select{cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 12px) 20px,calc(100% - 7px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.btn{
  border:1px solid var(--line);padding:14px 22px;font-size:10px;
  text-transform:uppercase;letter-spacing:.2em;transition:.16s;text-align:center;width:100%;
  min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px
}
.btn:active{transform:scale(.985)}
@media(hover:hover){.btn:hover{background:var(--solid);color:var(--onsolid);border-color:var(--solid)}}
.btn.solid{background:var(--solid);color:var(--onsolid);border-color:var(--solid)}
@media(hover:hover){.btn.solid:hover{opacity:.82}}
.btn.sm{padding:9px 14px;font-size:9px;width:auto;min-height:38px}
.btn.ghost{border-color:transparent;color:var(--dim)}
@media(hover:hover){.btn.ghost:hover{background:transparent;color:var(--txt);border-color:var(--line)}}
.btn.danger{color:var(--neg);border-color:var(--line)}
@media(hover:hover){.btn.danger:hover{background:var(--neg);border-color:var(--neg);color:#fff}}
.err{color:var(--neg);font-size:12px;min-height:16px;text-align:center}
.authnote{margin-top:32px;font-size:10px;color:var(--dim2);text-align:center;line-height:1.8}
.setuprow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.divline{height:1px;background:var(--line);margin:4px 0}
.steplbl{font-size:9px;color:var(--dim)}
/* teclado PIN */
.pindots{display:flex;gap:16px;justify-content:center;margin:34px 0 26px}
.pindots i{width:11px;height:11px;border:1px solid var(--dim);border-radius:50%;transition:.15s}
.pindots i.on{background:var(--solid);border-color:var(--solid)}
.pindots.bad i{border-color:var(--neg);background:transparent;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:0 auto}
.keys button{
  height:64px;border:1px solid var(--line);font-size:22px;font-weight:200;
  display:flex;align-items:center;justify-content:center;transition:.12s
}
.keys button:active{background:var(--solid);color:var(--onsolid)}
.keys button.blank{border-color:transparent;pointer-events:none}
.keys button.fn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* ===================== SHELL ===================== */
#app{min-height:100dvh;display:flex;flex-direction:column}
header{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)
}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 18px}
.hmark{font-size:13px;font-weight:200;letter-spacing:.34em;text-indent:.34em}
.hspace{flex:1}
.chips{display:flex;gap:7px;padding:0 18px 11px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);padding:7px 13px;white-space:nowrap;transition:.15s;border-radius:999px
}
.chip.on{background:var(--solid);color:var(--onsolid);border-color:var(--solid)}
.iconbtn{
  width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);color:var(--dim);transition:.15s;border-radius:0
}
.iconbtn svg{width:17px;height:17px}
.iconbtn.on,.iconbtn:active{color:var(--txt);border-color:var(--solid)}
.curbtn{font-size:10px;letter-spacing:.1em;min-width:52px;padding:0 6px}
main{flex:1;width:100%;max-width:1320px;margin:0 auto;
  padding:20px 18px calc(96px + env(safe-area-inset-bottom))}
/* tab bar inferior (celular) */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)
}
#nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:11px 2px 9px;color:var(--dim2);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;transition:.15s
}
#nav button svg{width:21px;height:21px}
#nav button.on{color:var(--txt)}
.fab{
  position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:45;
  width:54px;height:54px;border-radius:50%;background:var(--solid);color:var(--onsolid);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:200;
  box-shadow:0 6px 22px rgba(0,0,0,.35)
}
.fab:active{transform:scale(.94)}
@media(min-width:900px){
  .hrow{padding:14px 26px;gap:16px}
  .chips{padding:0 26px 0;overflow:visible}
  header{display:flex;flex-direction:column}
  .hbar{display:flex;align-items:center;width:100%}
  #nav{position:static;border-top:0;border-bottom:1px solid var(--line);
    background:transparent;backdrop-filter:none;padding:0 26px;gap:30px}
  #nav button{flex:none;flex-direction:row;gap:9px;padding:13px 0;font-size:10px;letter-spacing:.16em;
    border-bottom:1px solid transparent}
  #nav button.on{border-bottom-color:var(--solid)}
  #nav button svg{width:15px;height:15px}
  main{padding:30px 26px 90px}
  .fab{display:none}
}

/* ===================== BLOQUES ===================== */
.sect{margin-bottom:34px}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sectitle{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.18em}
.sechead .hspace{flex:1}
.grid{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.cell{background:var(--bg);padding:17px 16px}
.cell.wide{grid-column:1/-1}
.klbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.16em;margin-bottom:10px}
.kval{font-size:23px;font-weight:200;letter-spacing:-.01em}
.kval.big{font-size:40px}
.ksub{font-size:10px;color:var(--dim2);margin-top:6px}
.panel{border:1px solid var(--line);background:var(--panel);padding:18px 16px;box-shadow:var(--shadow)}
.panel h3{font-size:9px;color:var(--dim);font-weight:400;text-transform:uppercase;letter-spacing:.18em;margin-bottom:16px}
@media(min-width:900px){.cell{padding:20px}.panel{padding:22px}.kval{font-size:26px}.kval.big{font-size:44px}}

/* ===================== FILAS (lista/tabla) ===================== */
.rows{border:1px solid var(--line)}
.rhead{display:none}
.row{
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;
  padding:13px 15px;border-bottom:1px solid var(--line2);transition:background .12s;cursor:pointer
}
.row:last-child{border-bottom:0}
.row:active{background:var(--hover)}
@media(hover:hover){.row:hover{background:var(--hover)}}
.rmain{min-width:0}
.rtitle{font-size:14.5px;font-weight:300;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rsub{font-size:11px;color:var(--dim);margin-top:3px}
.ramt{font-size:15px;font-weight:300;text-align:right;white-space:nowrap}
.rextra{font-size:10px;color:var(--dim);text-align:right;white-space:nowrap}
.rbtn{grid-column:1/-1;margin-top:9px}
@media(min-width:900px){
  .rhead{display:grid;grid-template-columns:1fr auto 130px;gap:12px;padding:11px 15px;
    border-bottom:1px solid var(--line);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em}
  .row{grid-template-columns:1fr auto 130px}
  .rbtn{grid-column:auto;margin-top:0;width:auto}
}
.tag{display:inline-block;font-size:8px;letter-spacing:.13em;text-transform:uppercase;
  border:1px solid var(--line);padding:2px 6px;color:var(--dim);border-radius:2px}
.tag.fam{border-color:color-mix(in srgb,var(--pos) 40%,transparent);color:var(--pos)}
.tag.ok{border-color:color-mix(in srgb,var(--pos) 40%,transparent);color:var(--pos)}
.empty{padding:40px 20px;text-align:center;color:var(--dim2);font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line)}

/* ===================== CARDS ===================== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--panel);padding:17px;display:flex;flex-direction:column;gap:11px;cursor:pointer;box-shadow:var(--shadow)}
.card:active{background:var(--hover)}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cname{font-size:15.5px;font-weight:300;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cmeta{font-size:9px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
.cbig{font-size:25px;font-weight:200}
.bar{height:2px;background:var(--track);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--solid)}
.bar i.g{background:var(--pos)}
.crow{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--dim)}
.cbtns{display:flex;gap:8px}
.cbtns .btn{flex:1}

/* ===================== MODAL / SHEET ===================== */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:90;
  display:flex;align-items:flex-end;justify-content:center;overflow-y:auto;animation:fade .16s}
:root[data-theme="light"] .ovl{background:rgba(0,0,0,.35)}
@keyframes fade{from{opacity:0}}
.modal{
  background:var(--bg);border:1px solid var(--line);width:100%;max-width:520px;
  padding:24px 20px calc(26px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1);
  max-height:94dvh;overflow-y:auto
}
@keyframes up{from{transform:translateY(28px);opacity:.4}}
.modal h2{font-size:10px;font-weight:400;text-transform:uppercase;letter-spacing:.2em;color:var(--dim);margin-bottom:20px}
.grab{width:34px;height:3px;background:var(--track);margin:-8px auto 16px;border-radius:2px}
.mform{display:flex;flex-direction:column;gap:18px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mact{display:flex;gap:10px;margin-top:4px}
.segf{display:flex;border:1px solid var(--line)}
.segf button{flex:1;padding:12px 6px;font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);transition:.14s}
.segf button.on{background:var(--solid);color:var(--onsolid)}
.help{font-size:10.5px;color:var(--dim2);margin-top:6px;line-height:1.6}
@media(min-width:900px){
  .ovl{align-items:center;padding:20px}
  .modal{animation:pop .18s}
  .grab{display:none}
  @keyframes pop{from{transform:scale(.97);opacity:0}}
}

/* ===================== VARIOS ===================== */
.chartbox{width:100%}
.lgd{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.lgd div{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim)}
.dot{width:8px;height:8px;flex:none;border-radius:2px}
.lgd span.v{margin-left:auto;color:var(--txt);font-weight:300;white-space:nowrap}
.alert{border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  background:color-mix(in srgb,var(--warn) 7%,transparent);padding:12px 15px;font-size:12.5px;
  color:var(--warn);margin-bottom:9px;display:flex;gap:10px;align-items:center;line-height:1.5}
.alert b{font-weight:500}
.alert .btn{width:auto;margin-left:auto;flex:none;border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.pill{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
.mnav{display:flex;align-items:center;gap:10px}
.mnav .mlbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;min-width:120px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(100px + env(safe-area-inset-bottom));background:var(--solid);color:var(--onsolid);
  padding:12px 22px;font-size:10px;text-transform:uppercase;letter-spacing:.18em;z-index:120;animation:tin .2s;max-width:88vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
@media(min-width:900px){.toast{bottom:26px}}
.themerow{display:flex;gap:8px}
.themerow button{flex:1;border:1px solid var(--line);padding:14px 8px;font-size:9px;
  text-transform:uppercase;letter-spacing:.13em;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:8px}
.themerow button svg{width:18px;height:18px}
.themerow button.on{border-color:var(--solid);color:var(--txt)}
</style>
</head>
<body>

<div id="auth"></div>

<div id="app" class="hide">
  <header>
    <div class="hbar">
      <div class="hrow">
        <div class="hmark">ORBIT</div>
        <div class="hspace"></div>
        <button class="iconbtn curbtn num" data-act="curtog" id="curBtn">$ ARS</button>
        <button class="iconbtn" data-act="go" data-v="set" title="Ajustes" id="setBtn"></button>
      </div>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-scope="all">Todo</button>
      <button class="chip" data-scope="mine">Míos</button>
      <button class="chip" data-scope="fam">Familiar</button>
      <span class="hspace"></span>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
  <button class="fab hide" id="fab" data-act="newtx">+</button>
</div>

<div id="modalRoot"></div>

<script>
/* ============================================================
   ORBIT · Finanzas personales y familiares
   App instalable (PWA). Datos locales de cada dispositivo.
   ============================================================ */
const LS='orbit_fin_v1', SESS='orbit_sess', DEV='orbit_device', THEME='orbit_theme';
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const todayISO=()=>new Date().toISOString().slice(0,10);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const CAT_G=['Supermercado','Alquiler / Expensas','Servicios','Transporte','Salud','Educación','Restaurantes','Ocio','Ropa','Impuestos','Cuotas / Deudas','Otros'];
const CAT_I=['Sueldo','Honorarios','Alquileres','Ventas','Intereses','Reintegros','Otros'];
const PAL_D=['#ffffff','#5fe3a1','#6aa9ff','#ffcc4d','#ff8f6b','#c58bff','#4fd6d6','#ff5f9e','#9aa0a6','#8ee06b'];
const PAL_L=['#111111','#0a8f52','#2563eb','#b45309','#c2410c','#7c3aed','#0e7490','#be185d','#6b7280','#4d7c0f'];

/* Fuentes de datos de mercado. Son públicas y gratuitas: la app solo pide la
   tabla de precios del día, no envía ningún dato tuyo. */
const API={
  dolar:'https://dolarapi.com/v1/dolares',
  ars:['https://data912.com/live/arg_cedears','https://data912.com/live/arg_stocks',
       'https://data912.com/live/arg_bonds','https://data912.com/live/arg_notes'],
  usd:['https://data912.com/live/usa_stocks']
};
const CASAS=[['oficial','Oficial'],['blue','Blue'],['bolsa','MEP (Bolsa)'],['contadoconliqui','CCL'],
             ['mayorista','Mayorista'],['cripto','Cripto'],['tarjeta','Tarjeta'],['manual','Manual']];
const casaLbl=c=>{const f=CASAS.find(x=>x[0]===c);return f?f[1]:c};

const IC={
  dash:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',
  mov:'<path d="M7 3v18M7 3L3.5 6.5M7 3l3.5 3.5M17 21V3M17 21l-3.5-3.5M17 21l3.5-3.5"/>',
  fijos:'<rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  ahorro:'<path d="M3 9h18v11H3z"/><path d="M3 9l3-5h12l3 5"/><path d="M10 13h4"/>',

async function hashPw(pw,salt){
  const data=new TextEncoder().encode(salt+'::'+pw);
  if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
    try{const b=await crypto.subtle.digest('SHA-256',data);
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){}
  }
  let h=5381; const s=salt+'::'+pw;
  for(let i=0;i<s.length;i++){h=((h*33)^s.charCodeAt(i))>>>0}
  return 'fb'+h.toString(16);
}

async function getJSON(u,ms=9000){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(u,{signal:c.signal,cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }finally{clearTimeout(t)}
}

function aplicarDolar(){
  const c=S.settings.dolarCasa;
  if(c==='manual') return;
  const d=(S.market.dolares||[]).find(x=>x.casa===c);
  if(d&&d.venta>0){S.settings.usdRate=d.venta;S.settings.rateDate=todayISO()}
}
async function syncMercado(manual){
  if(syncing) return;
  syncing=true; if(manual)pintarSync(true);
  const M=S.market;
  try{
    M.dolares=(await getJSON(API.dolar)).map(x=>({
      casa:x.casa,nombre:x.nombre,compra:x.compra,venta:x.venta,fecha:x.fechaActualizacion}));
    aplicarDolar();

    const auto=S.holds.filter(h=>h.auto!==false&&h.tk);
    const enARS=auto.filter(h=>h.cur==='ARS'), enUSD=auto.filter(h=>h.cur==='USD');
    M.px=M.px||{};
    const cargar=async(urls,moneda,tenencias)=>{
      if(!tenencias.length) return;
      const listas=await Promise.all(urls.map(u=>getJSON(u).catch(()=>[])));
      const map={}; listas.flat().forEach(x=>{if(x&&x.symbol)map[x.symbol]=x});
      tenencias.forEach(h=>{
        const r=map[h.tk];
        /* la clave lleva la moneda: el CEDEAR de AAPL en pesos y la acción AAPL
           en dólares son dos precios distintos y no se pueden pisar */
        if(r&&Number(r.c)>0) M.px[pxKey(h.tk,moneda)]={v:Number(r.c),pct:Number(r.pct_change)||0,cur:moneda,ts:new Date().toISOString()};
      });
    };
    await cargar(API.ars,'ARS',enARS);
    await cargar(API.usd,'USD',enUSD);

    S.holds.forEach(h=>{
      const p=getPx(h);
      if(h.auto!==false&&p&&p.v>0) h.now=p.v;
    });
    M.updated=new Date().toISOString(); M.error=null;
    save();
    if(manual){render(true);toast('Precios actualizados')}
    else render(true);
  }catch(e){
    M.error = e.name==='AbortError' ? 'la consulta tardó demasiado'
            : /fetch|network|load failed|networkerror/i.test(e.message||'') ? 'sin conexión a internet'
            : (e.message||'error desconocido');
    save();
    if(manual){render(true);toast('No se pudo actualizar')} else pintarSync(false);
  }finally{syncing=false}
}
function pintarSync(on){
  document.querySelectorAll('[data-act=sync]').forEach(b=>{
    b.disabled=on; b.textContent=on?'Actualizando…':'Actualizar ahora';
  });
}

/* ---------------- cálculos ---------------- */
function fdInteres(f){
  const tot=Math.max(days(f.start,f.end),1);
  const pas=Math.min(Math.max(days(f.start,todayISO()),0),tot);
  const full=Number(f.amount)*(Number(f.tna)/100)*(tot/365);
  return {tot,pas,dev:full*(pas/tot),full,rest:tot-pas};
}
function patrimonio(){
  let ef=0,pf=0,inv=0,invCosto=0,deu=0;
  F('boxes').forEach(b=>ef+=toARS(b.amount,b.cur));
  F('fds').forEach(f=>{const i=fdInteres(f);pf+=toARS(Number(f.amount)+i.dev,f.cur)});
  F('holds').forEach(h=>{inv+=toARS(h.qty*h.now,h.cur);invCosto+=toARS(h.qty*h.buy,h.cur)});
  F('debts').forEach(d=>deu+=toARS(Math.max(d.cuotas-d.pagadas,0)*d.cuota,d.cur));
  return {ef,pf,inv,invCosto,deu,neto:ef+pf+inv-deu};
}
const txRange=(a,b)=>F('tx').filter(t=>t.date>=a&&t.date<=b);
const sumTx=(l,t)=>l.filter(x=>x.type===t).reduce((a,x)=>a+toARS(x.amount,x.cur),0);
function perRange(){
  /* el período llega hasta fin del mes en curso: cuentan los movimientos ya
     cargados con fecha posterior a hoy (alquiler del 20, cuota del 25, etc.) */
  const hoy=todayISO(), ym=hoy.slice(0,7), fin=ym+'-31';
  if(dashPer==='m') return [ym+'-01',fin];
  if(dashPer==='3m') return [shiftYM(ym,-2)+'-01',fin];
  if(dashPer==='y') return [hoy.slice(0,4)+'-01-01',fin];
  return ['1900-01-01','9999-12-31'];
}

function pinPress(k){

  const g=id=>$('#'+id).value.trim();

  if(!u[0][0]||!u[0][1]||u[0][2].length<4) return err('Completá el usuario 1 (contraseña de 4+ caracteres).');
  if(u[1][0]||u[1][1]||u[1][2]){

    if(u[0][1].toLowerCase()===u[1][1].toLowerCase()) return err('Los emails tienen que ser distintos.');
  }
  S.users=[];
  for(const [n,e,p] of u){
    if(!n) continue;
    const salt=uid();
    S.users.push({id:uid(),name:n,email:e.toLowerCase(),salt,hash:await hashPw(p,salt)});

/* ============================================================
   CHARTS
   ============================================================ */
function barsChart(ser){
  const W=520,H=190,pad=22,bw=13,gap=5;
  const max=Math.max(1,...ser.map(s=>Math.max(s.i,s.g)));
  const step=(W-pad*2)/ser.length, base=H-24;
  let b='';
  ser.forEach((s,k)=>{
    const cx=pad+step*k+step/2;
    const hi=(s.i/max)*(base-12), hg=(s.g/max)*(base-12);
    b+=`<rect x="${cx-bw-gap/2}" y="${base-hi}" width="${bw}" height="${Math.max(hi,1)}" fill="currentColor"/>`;
    b+=`<rect x="${cx+gap/2}" y="${base-hg}" width="${bw}" height="${Math.max(hg,1)}" fill="currentColor" opacity=".3"/>`;
    b+=`<text x="${cx}" y="${H-5}" fill="currentColor" opacity=".45" font-size="9" text-anchor="middle" letter-spacing="1">${MES3[+s.ym.slice(5)-1].toUpperCase()}</text>`;
  });
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">
    <line x1="${pad-8}" y1="${base}" x2="${W-pad+8}" y2="${base}" stroke="currentColor" opacity=".18"/>${b}</svg></div>
    <div class="lgd">
      <div><i class="dot" style="background:currentColor"></i>Ingresos<span class="v num">${fmt(ser.reduce((a,s)=>a+s.i,0))}</span></div>
      <div><i class="dot" style="background:currentColor;opacity:.3"></i>Gastos<span class="v num">${fmt(ser.reduce((a,s)=>a+s.g,0))}</span></div>
    </div>`;
}
function donut(items){
  const tot=items.reduce((a,x)=>a+x.value,0)||1;
  const R=54,C=2*Math.PI*R; let off=0,arcs='';
  items.forEach(x=>{
    const len=x.value/tot*C;
    arcs+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${x.color}" stroke-width="15"
      stroke-dasharray="${Math.max(len-1.5,0)} ${C-len+1.5}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off+=len;
  });
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 140 140" width="132" height="132" style="flex:none;margin:0 auto">${arcs}
      <text x="70" y="67" fill="currentColor" font-size="11" text-anchor="middle" font-weight="300" letter-spacing="1">TOTAL</text>
      <text x="70" y="84" fill="currentColor" opacity=".55" font-size="9" text-anchor="middle">${fmt(tot)}</text></svg>
    <div class="lgd" style="flex:1;min-width:210px;margin:0">
      ${items.slice(0,8).map(x=>`<div><i class="dot" style="background:${x.color}"></i>${esc(x.label)}
        <span class="v num">${fmt(x.value)} · ${(x.value/tot*100).toFixed(0)}%</span></div>`).join('')}
    </div></div>`;
}
function lineChart(pts){
  const W=900,H=190,pl=6,pr=6,base=H-22,top=14;
  const vs=pts.map(p=>p.v), mx=Math.max(...vs,0), mn=Math.min(...vs,0), rng=(mx-mn)||1;
  const X=i=>pl+(i*(W-pl-pr)/Math.max(pts.length-1,1));
  const Y=v=>top+(1-(v-mn)/rng)*(base-top);
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area=d+` L ${X(pts.length-1).toFixed(1)} ${Y(Math.max(mn,0)).toFixed(1)} L ${X(0).toFixed(1)} ${Y(Math.max(mn,0)).toFixed(1)} Z`;
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="min-height:190px">
    <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity=".22"/><stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}" stroke="currentColor" opacity=".2" stroke-dasharray="3 4"/>
    <path d="${area}" fill="url(#gr)"/>
    <path d="${d}" fill="none" stroke="currentColor" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    ${pts.map((p,i)=>i%2===0?`<text x="${X(i)}" y="${H-5}" fill="currentColor" opacity=".38" font-size="9" text-anchor="middle">${MES3[+p.ym.slice(5)-1].toUpperCase()}</text>`:'').join('')}
  </svg></div>
  <div class="lgd"><div>Acumulado a hoy<span class="v num ${pts[pts.length-1].v>=0?'pos':'neg'}">${fmt(pts[pts.length-1].v)}</span></div></div>`;
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const ferr=m=>{const e=$('#ferr'); if(e)e.textContent=m; return false};
function openForm(o){
  const vals={...(o.values||{})};
  const fldHTML=f=>{
    const v=vals[f.k]!==undefined&&vals[f.k]!==null?vals[f.k]:(f.def!==undefined?f.def:'');
    if(f.type==='seg') return `<div class="fld"><label class="up">${f.label}</label>
      <div class="segf" data-seg="${f.k}">${f.opts.map(op=>`<button type="button" data-v="${op.v}" class="${String(v)===String(op.v)?'on':''}">${op.l}</button>`).join('')}</div>
      ${f.help?`<div class="help">${f.help}</div>`:''}</div>`;
    if(f.type==='select') return `<div class="fld"><label class="up">${f.label}</label>
      <select data-k="${f.k}">${f.opts.map(op=>`<option value="${esc(op.v)}" ${String(v)===String(op.v)?'selected':''}>${esc(op.l)}</option>`).join('')}</select>
      ${f.help?`<div class="help">${f.help}</div>`:''}</div>`;
    const im=f.type==='number'?'decimal':(f.type==='tel'?'numeric':null);
    return `<div class="fld"><label class="up">${f.label}</label>
      <input data-k="${f.k}" type="${f.type==='tel'?'password':(f.type||'text')}" ${im?`inputmode="${im}"`:''}
        ${f.step?`step="${f.step}"`:''} ${f.type==='tel'?'maxlength="4" autocomplete="off"':''}
        value="${esc(v)}" placeholder="${esc(f.ph||'')}">
      ${f.help?`<div class="help">${f.help}</div>`:''}</div>`;
  };
  let body='',i=0;
  while(i<o.fields.length){
    const f=o.fields[i];
    if(f.half&&o.fields[i+1]&&o.fields[i+1].half){body+=`<div class="mrow">${fldHTML(f)}${fldHTML(o.fields[i+1])}</div>`;i+=2}
    else{body+=fldHTML(f);i++}
  }
  $('#modalRoot').innerHTML=`<div class="ovl"><div class="modal">
    <div class="grab"></div><h2>${o.title}</h2><div class="mform">${body}
    <div class="err" id="ferr"></div>
    <div class="mact"><button class="btn" data-x="cancel">${o.cancel||'Cancelar'}</button>
    <button class="btn solid" data-x="ok">${o.ok||'Guardar'}</button></div>
    ${o.del?`<button class="btn danger" data-x="del" style="margin-top:4px">Eliminar</button>`:''}
    </div></div></div>`;
  const root=$('#modalRoot');
  root.querySelectorAll('[data-seg]').forEach(g=>{
    const on=g.querySelector('button.on'); if(on)vals[g.dataset.seg]=on.dataset.v;
    g.onclick=e=>{const b=e.target.closest('button'); if(!b)return;
      g.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      vals[g.dataset.seg]=b.dataset.v};
  });
  const collect=()=>{root.querySelectorAll('[data-k]').forEach(el=>vals[el.dataset.k]=el.value);return vals};
  root.querySelector('[data-x=cancel]').onclick=closeForm;
  root.querySelector('.ovl').onclick=e=>{if(e.target.classList.contains('ovl'))closeForm()};
  const dl=root.querySelector('[data-x=del]');
  if(dl) dl.onclick=()=>{closeForm();confirmar(o.delMsg||'¿Eliminar este registro?',o.del)};
  root.querySelector('[data-x=ok]').onclick=async()=>{
    const v=collect();
    for(const f of o.fields){
      if(f.req&&(v[f.k]===''||v[f.k]==null)) return ferr('Falta completar: '+f.label);
      if(f.type==='number'&&v[f.k]!==''&&isNaN(Number(v[f.k]))) return ferr('Número inválido en: '+f.label);
    }
    const r=await o.onSave(v); if(r===false)return;
    closeForm();
  };
  root.querySelectorAll('input').forEach(inp=>inp.onkeydown=e=>{if(e.key==='Enter')root.querySelector('[data-x=ok]').click()});
  if(window.innerWidth>900){const f0=root.querySelector('input,select'); if(f0)f0.focus()}
}

/* ---------------- backup ---------------- */
function exportar(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const name='orbit-finanzas-'+todayISO()+'.json';
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Backup ORBIT'}).catch(()=>{});
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Backup descargado');
}
function importar(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.onchange=()=>{
    const f=i.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.users||!Array.isArray(d.tx)) throw 0;
        confirmar('Vas a reemplazar TODOS los datos de este dispositivo por los del archivo.',()=>{
          S=d; save(); const u=S.users.find(x=>x.id===(me&&me.id))||S.users[0];
          me=u; lsSet(SESS,u.id); lsDel(DEV); render(); toast('Backup importado');
        });
      }catch(e){toast('Archivo inválido')}
    };
    r.readAsText(f);
  };
  i.click();
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click',e=>{
  const kb=e.target.closest('#keys button[data-k]'); if(kb){pinPress(kb.dataset.k);return}
  const nb=e.target.closest('#nav button'); if(nb){view=nb.dataset.view;render();return}
  const cb=e.target.closest('#chips .chip'); if(cb&&cb.dataset.scope){scope=cb.dataset.scope;render();return}
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act, id=b.dataset.id;
  const A={
    dosetup:doSetup, dologin:doLogin, usepw:()=>{lsDel(DEV);renderAuth()},
    logout, go:()=>{view=b.dataset.v;render()},
    curtog:()=>{cur=cur==='ARS'?'USD':'ARS';render()},
    per:()=>{dashPer=b.dataset.p;render()},
    mv:()=>{mvYM=shiftYM(mvYM,Number(b.dataset.d));render()},
    theme:()=>setTheme(b.dataset.t),
    pinnew:askPin,
    pinoff:()=>confirmar('¿Quitar el PIN de este dispositivo? Vas a entrar con mail y contraseña.',()=>{lsDel(DEV);render();toast('PIN quitado')}),
    install:howInstall,
    newtx:()=>formTx(), edittx:()=>formTx(id),
    newrec:()=>formRec(), editrec:()=>formRec(id), recgo:()=>recGo(id),
    newdebt:()=>formDebt(), editdebt:()=>formDebt(id), paydebt:()=>payDebt(id),
    newbox:()=>formBox(), editbox:()=>formBox(id), boxmov:()=>boxMov(id,Number(b.dataset.s)),
    newfd:()=>formFD(), editfd:()=>formFD(id),
    newhold:()=>formHold(), edithold:()=>formHold(id), price:()=>formPrice(id),
    sync:()=>syncMercado(true),
    casa:()=>{S.settings.dolarCasa=b.dataset.c;aplicarDolar();save();render();
      toast('Usando dólar '+casaLbl(b.dataset.c).toLowerCase())},
    saverate:()=>{const v=Number($('#setRate').value);
      if(v>0){S.settings.usdRate=v;S.settings.rateDate=todayISO();save();render();toast('Cotización actualizada')}},
    addcat:()=>formCat(b.dataset.t),
    delcat:()=>{const t=b.dataset.t,c=b.dataset.c;
      if(t==='G')S.settings.catG=S.settings.catG.filter(x=>x!==c); else S.settings.catI=S.settings.catI.filter(x=>x!==c);
      save();render()},
    chpw:formPw, exp:exportar, imp:importar,
    wipe:()=>confirmar('Se borran TODOS los datos y los usuarios de este dispositivo. Vas a tener que configurar la app de cero.',()=>{
      lsDel(LS);lsDel(SESS);lsDel(DEV);S=blank();me=null;renderAuth()})
  };
  if(A[a]){e.preventDefault();A[a]()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});

/* bloqueo por inactividad cuando hay PIN */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(me&&dev().pin&&hiddenAt&&Date.now()-hiddenAt>5*60*1000){me=null;renderAuth()}
});

/* ---------------- arranque ---------------- */
load(); applyTheme();
const d0=dev(), sid=lsGet(SESS);
if(d0.pin&&d0.uid&&S.users.some(u=>u.id===d0.uid)){renderAuth()}
else{
  const su=sid?S.users.find(u=>u.id===sid):null;
  if(su){me=su;boot()}else renderAuth();
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
